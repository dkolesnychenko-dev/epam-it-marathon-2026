<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 670" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1e293b"/>
    </marker>
  </defs>
  <rect width="960" height="670" fill="#ffffff"/>
  <text x="480" y="28" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">Figure 2 - How a subagent is launched after plan approval, and returns its result</text>

  <!-- Lifelines -->
  <line x1="100" y1="94" x2="100" y2="600" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 4"/>
  <line x1="340" y1="94" x2="340" y2="600" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 4"/>
  <line x1="600" y1="94" x2="600" y2="600" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 4"/>
  <line x1="860" y1="94" x2="860" y2="600" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 4"/>

  <!-- Participant headers -->
  <rect x="5" y="50" width="190" height="44" rx="8" fill="#e0f2fe" stroke="#0369a1"/>
  <text x="100" y="69" text-anchor="middle" font-size="14" font-weight="bold" fill="#0c4a6e">User (Developer)</text>
  <text x="100" y="85" text-anchor="middle" font-size="10" fill="#334155">approves plan</text>

  <rect x="245" y="50" width="190" height="44" rx="8" fill="#ede9fe" stroke="#6d28d9"/>
  <text x="340" y="69" text-anchor="middle" font-size="14" font-weight="bold" fill="#4c1d95">Antigravity Engine</text>
  <text x="340" y="85" text-anchor="middle" font-size="10" fill="#334155">harness and sandbox</text>

  <rect x="505" y="50" width="190" height="44" rx="8" fill="#fef3c7" stroke="#b45309"/>
  <text x="600" y="69" text-anchor="middle" font-size="14" font-weight="bold" fill="#78350f">Orchestrator</text>
  <text x="600" y="85" text-anchor="middle" font-size="10" fill="#334155">orchestrator-agent (model)</text>

  <rect x="765" y="50" width="190" height="44" rx="8" fill="#dcfce7" stroke="#15803d"/>
  <text x="860" y="69" text-anchor="middle" font-size="14" font-weight="bold" fill="#14532d">aws-lambda-agent</text>
  <text x="860" y="85" text-anchor="middle" font-size="10" fill="#334155">isolated subagent context</text>

  <!-- 1. User to Engine -->
  <line x1="100" y1="125" x2="340" y2="125" stroke="#1e293b" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="220" y="117" text-anchor="middle" font-size="12" fill="#0f172a">1. Feature request on a feature branch</text>

  <!-- 2. Engine to Orchestrator -->
  <line x1="340" y1="161" x2="600" y2="161" stroke="#1e293b" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="470" y="153" text-anchor="middle" font-size="12" fill="#0f172a">2. Load orchestrator-agent.md as system prompt</text>

  <!-- 3. Orchestrator writes plan -->
  <line x1="600" y1="197" x2="340" y2="197" stroke="#1e293b" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="470" y="189" text-anchor="middle" font-size="12" fill="#0f172a">3. write_file: plan in .antigravity/docs/backend/plans/</text>

  <!-- 4. Orchestrator asks user for approval (through the engine chat) -->
  <line x1="600" y1="233" x2="100" y2="233" stroke="#b45309" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="350" y="225" text-anchor="middle" font-size="12" font-weight="bold" fill="#78350f">4. Present plan in chat, request approval</text>

  <!-- 5. User approves -->
  <line x1="100" y1="269" x2="600" y2="269" stroke="#b45309" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="350" y="261" text-anchor="middle" font-size="12" font-weight="bold" fill="#78350f">5. Developer approves (no subagent before this)</text>

  <!-- 6. Orchestrator invokes subagent -->
  <line x1="600" y1="305" x2="340" y2="305" stroke="#1e293b" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="470" y="297" text-anchor="middle" font-size="12" fill="#0f172a">6. invoke_subagent(aws-lambda-agent, plan path)</text>

  <!-- 7. Engine loads subagent profile -->
  <line x1="340" y1="341" x2="860" y2="341" stroke="#1e293b" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="600" y="333" text-anchor="middle" font-size="12" fill="#0f172a">7. Load aws-lambda-agent.md, grant its tool list</text>

  <!-- 8. Subagent runs skills -->
  <line x1="860" y1="377" x2="340" y2="377" stroke="#1e293b" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="600" y="369" text-anchor="middle" font-size="12" fill="#0f172a">8. Run skills: route-register, dotnet-build-check</text>

  <!-- 9. Observation back -->
  <line x1="340" y1="413" x2="860" y2="413" stroke="#1e293b" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
  <text x="600" y="405" text-anchor="middle" font-size="12" fill="#0f172a">9. Compiler output returned as observation</text>

  <!-- 10. Repeat until zero errors -->
  <line x1="860" y1="449" x2="340" y2="449" stroke="#1e293b" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="600" y="441" text-anchor="middle" font-size="12" fill="#0f172a">10. Repeat steps 8-9 until 0 build errors</text>

  <!-- 11. Final summary from subagent -->
  <line x1="860" y1="485" x2="340" y2="485" stroke="#1e293b" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="600" y="477" text-anchor="middle" font-size="12" fill="#0f172a">11. Final summary: build passed, files listed</text>

  <!-- Context cleared note -->
  <rect x="775" y="497" width="170" height="24" rx="6" fill="#fee2e2" stroke="#b91c1c"/>
  <text x="860" y="513" text-anchor="middle" font-size="11" font-weight="bold" fill="#7f1d1d">Subagent context cleared</text>

  <!-- 12. Summary becomes tool result -->
  <line x1="340" y1="545" x2="600" y2="545" stroke="#1e293b" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="470" y="537" text-anchor="middle" font-size="12" fill="#0f172a">12. Summary returned as the tool result</text>

  <!-- 13. Orchestrator continues -->
  <line x1="600" y1="581" x2="100" y2="581" stroke="#1e293b" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="350" y="573" text-anchor="middle" font-size="12" fill="#0f172a">13. Next: unit tests, review gate, final report</text>

  <text x="480" y="645" text-anchor="middle" font-size="11" fill="#64748b">Solid arrow = request or call. Dashed arrow = observation. Orange arrows = plan approval in chat, which must happen before step 6.</text>
</svg>
