  <text x="595" y="372" text-anchor="middle" font-size="11" fill="#334155">dotnet-test-runner</text>
  <text x="595" y="390" text-anchor="middle" font-size="11" fill="#334155">dotnet-build-check</text>

  <rect x="720" y="336" width="210" height="72" rx="8" fill="#fdf4ff" stroke="#a21caf"/>
