  <text x="135" y="354" text-anchor="middle" font-size="12" font-weight="bold" fill="#701a75">Skills</text>
  <text x="135" y="372" text-anchor="middle" font-size="11" fill="#334155">All skills (supervisory)</text>
  <text x="135" y="390" text-anchor="middle" font-size="11" fill="#334155">plan and report files only</text>

  <rect x="260" y="336" width="210" height="72" rx="8" fill="#fdf4ff" stroke="#a21caf"/>
  <text x="365" y="354" text-anchor="middle" font-size="12" font-weight="bold" fill="#701a75">Skills</text>
  <text x="365" y="372" text-anchor="middle" font-size="11" fill="#334155">route-register</text>
  <text x="365" y="390" text-anchor="middle" font-size="11" fill="#334155">syndicate-config-gen, dotnet-build-check</text>

  <rect x="490" y="336" width="210" height="72" rx="8" fill="#fdf4ff" stroke="#a21caf"/>
