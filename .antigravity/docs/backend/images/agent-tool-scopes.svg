  <rect x="272" y="210" width="186" height="24" rx="6" fill="#bbf7d0" stroke="#15803d"/>
  <text x="365" y="227" text-anchor="middle" font-size="12" font-family="Consolas, monospace" fill="#14532d">edit_file</text>
  <rect x="272" y="240" width="186" height="24" rx="6" fill="#bbf7d0" stroke="#15803d"/>
