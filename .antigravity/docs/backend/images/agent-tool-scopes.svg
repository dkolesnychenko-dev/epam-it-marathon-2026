  <rect x="732" y="150" width="186" height="24" rx="6" fill="#bbf7d0" stroke="#15803d"/>
  <text x="825" y="167" text-anchor="middle" font-size="12" font-family="Consolas, monospace" fill="#14532d">run_command</text>
