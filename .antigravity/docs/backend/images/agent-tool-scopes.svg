  <text x="825" y="372" text-anchor="middle" font-size="11" fill="#334155">backend-code-review-audit</text>
  <text x="825" y="390" text-anchor="middle" font-size="11" fill="#334155">dotnet-build-check</text>

  <!-- Boundaries -->
  <rect x="30" y="420" width="210" height="112" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="135" y="442" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f172a">Boundaries</text>
  <text x="135" y="462" text-anchor="middle" font-size="11" fill="#334155">Writes plans and reports only</text>
  <text x="135" y="480" text-anchor="middle" font-size="11" fill="#334155">Never touches dnapp/ or Tests/</text>
  <text x="135" y="498" text-anchor="middle" font-size="11" fill="#334155">Asks user for plan approval</text>

  <rect x="260" y="420" width="210" height="112" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="365" y="442" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f172a">Boundaries</text>
  <text x="365" y="462" text-anchor="middle" font-size="11" fill="#334155">Writes dnapp/ production code</text>
  <text x="365" y="480" text-anchor="middle" font-size="11" fill="#334155">Must not touch Tests/</text>
  <text x="365" y="498" text-anchor="middle" font-size="11" fill="#334155">Must not run dotnet test</text>

  <rect x="490" y="420" width="210" height="112" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="595" y="442" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f172a">Boundaries</text>
  <text x="595" y="462" text-anchor="middle" font-size="11" fill="#334155">Writes Tests/ only</text>
  <text x="595" y="480" text-anchor="middle" font-size="11" fill="#334155">Must not edit dnapp/</text>
  <text x="595" y="498" text-anchor="middle" font-size="11" fill="#334155">Reports production bugs</text>

  <rect x="720" y="420" width="210" height="112" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="825" y="442" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f172a">Boundaries</text>
  <text x="825" y="462" text-anchor="middle" font-size="11" fill="#334155">Advisory: reports findings</text>
  <text x="825" y="480" text-anchor="middle" font-size="11" fill="#334155">No edit or write tools</text>
  <text x="825" y="498" text-anchor="middle" font-size="11" fill="#334155">Platform-enforced</text>

  <!-- Legend -->
  <rect x="30" y="552" width="22" height="14" rx="4" fill="#bbf7d0" stroke="#15803d"/>
  <text x="60" y="564" font-size="12" fill="#334155">Listed in the agent's tools (registered for that agent)</text>
  <rect x="520" y="552" width="22" height="14" rx="4" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="550" y="564" font-size="12" fill="#334155">Not listed (not offered to that agent)</text>
  <text x="30" y="586" font-size="11" fill="#64748b">Tool lists are enforced by the platform. Boundaries written in the text are enforced by instructions and review gates.</text>
</svg>
