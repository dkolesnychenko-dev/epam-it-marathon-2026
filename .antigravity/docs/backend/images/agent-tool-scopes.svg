  <rect x="502" y="150" width="186" height="24" rx="6" fill="#bbf7d0" stroke="#15803d"/>
  <text x="595" y="167" text-anchor="middle" font-size="12" font-family="Consolas, monospace" fill="#14532d">run_command</text>
  <rect x="502" y="180" width="186" height="24" rx="6" fill="#bbf7d0" stroke="#15803d"/>
  <text x="595" y="197" text-anchor="middle" font-size="12" font-family="Consolas, monospace" fill="#14532d">read_file</text>
  <rect x="502" y="210" width="186" height="24" rx="6" fill="#bbf7d0" stroke="#15803d"/>
  <text x="595" y="227" text-anchor="middle" font-size="12" font-family="Consolas, monospace" fill="#14532d">edit_file</text>
