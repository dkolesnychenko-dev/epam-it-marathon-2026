  <text x="365" y="287" text-anchor="middle" font-size="12" font-family="Consolas, monospace" fill="#94a3b8">invoke_subagent</text>
  <rect x="272" y="300" width="186" height="24" rx="6" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="365" y="317" text-anchor="middle" font-size="12" font-family="Consolas, monospace" fill="#94a3b8">send_message</text>

