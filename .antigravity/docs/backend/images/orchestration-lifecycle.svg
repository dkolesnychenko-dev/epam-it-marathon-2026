<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 780" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/>
    </marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c2410c"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#15803d"/>
    </marker>
  </defs>
  <rect width="980" height="780" fill="#ffffff"/>
  <text x="490" y="28" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">Figure 3 - Sequential Orchestration Lifecycle with Approval and Quality Gates</text>

  <!-- 1. User request -->
  <rect x="240" y="45" width="400" height="52" rx="10" fill="#e2e8f0" stroke="#475569" stroke-width="2"/>
  <text x="440" y="68" text-anchor="middle" font-size="14" font-weight="bold" fill="#0f172a">1. User Request Received</text>
  <text x="440" y="86" text-anchor="middle" font-size="11" fill="#334155">Developer creates feature branch: git checkout -b feature/&lt;name&gt;</text>

  <!-- 2. Plan -->
  <rect x="240" y="118" width="400" height="52" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
  <text x="440" y="140" text-anchor="middle" font-size="14" font-weight="bold" fill="#0f172a">2. Orchestrator Writes Implementation Plan</text>
  <text x="440" y="158" text-anchor="middle" font-size="11" fill="#334155">Saved to .antigravity/docs/backend/plans/{feature}-plan.md</text>

  <!-- 3. Approval gate -->
  <polygon points="440,192 560,224 440,256 320,224" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
  <text x="440" y="222" text-anchor="middle" font-size="13" font-weight="bold" fill="#78350f">User Approval Gate</text>
  <text x="440" y="238" text-anchor="middle" font-size="10" fill="#78350f">Requires user confirmation</text>

  <!-- 4. Implementation -->
  <rect x="240" y="280" width="400" height="54" rx="10" fill="#e0e7ff" stroke="#4338ca" stroke-width="2"/>
  <text x="440" y="302" text-anchor="middle" font-size="14" font-weight="bold" fill="#0f172a">3. aws-lambda-agent: Implementation</text>
  <text x="440" y="322" text-anchor="middle" font-size="11" fill="#334155">Uses skills: route-register, syndicate-config-gen, dotnet-build-check</text>

  <!-- 5. Tests -->
  <rect x="240" y="360" width="400" height="54" rx="10" fill="#fef9c3" stroke="#a16207" stroke-width="2"/>
  <text x="440" y="382" text-anchor="middle" font-size="14" font-weight="bold" fill="#0f172a">4. unit-test-agent: Write and Run Tests</text>
  <text x="440" y="402" text-anchor="middle" font-size="11" fill="#334155">Uses skills: dotnet-test-runner, dotnet-build-check</text>

  <!-- 6. Review -->
  <rect x="240" y="440" width="400" height="54" rx="10" fill="#fce7f3" stroke="#be185d" stroke-width="2"/>
  <text x="440" y="462" text-anchor="middle" font-size="14" font-weight="bold" fill="#0f172a">5. code-review-agent: Architectural Audit</text>
  <text x="440" y="482" text-anchor="middle" font-size="11" fill="#334155">Uses skills: backend-code-review-audit (advisory, read-only)</text>

  <!-- Verdict decision -->
  <polygon points="440,518 530,552 440,586 350,552" fill="#fff7ed" stroke="#c2410c" stroke-width="2"/>
  <text x="440" y="557" text-anchor="middle" font-size="14" font-weight="bold" fill="#7c2d12">Verdict?</text>

  <!-- 6. Final deliverable -->
  <rect x="240" y="635" width="400" height="54" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
  <text x="440" y="657" text-anchor="middle" font-size="14" font-weight="bold" fill="#0f172a">6. Final Deliverable and Report</text>
  <text x="440" y="677" text-anchor="middle" font-size="11" fill="#334155">Saved to .antigravity/docs/backend/reports/{feature}-report.md</text>

  <!-- Needs discussion -->
  <rect x="20" y="525" width="230" height="54" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="135" y="547" text-anchor="middle" font-size="12" font-weight="bold" fill="#991b1b">NEEDS DISCUSSION</text>
  <text x="135" y="565" text-anchor="middle" font-size="11" fill="#7f1d1d">Halt pipeline, escalate to user</text>

  <!-- Main flow -->
  <line x1="440" y1="97" x2="440" y2="118" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="440" y1="170" x2="440" y2="192" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="440" y1="256" x2="440" y2="280" stroke="#15803d" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="450" y="272" text-anchor="start" font-size="11" font-weight="bold" fill="#15803d">Approved</text>
  <line x1="440" y1="334" x2="440" y2="360" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="440" y1="414" x2="440" y2="440" stroke="#15803d" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="450" y="431" text-anchor="start" font-size="11" font-weight="bold" fill="#15803d">All tests pass</text>
  <line x1="440" y1="494" x2="440" y2="518" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="440" y1="586" x2="440" y2="635" stroke="#15803d" stroke-width="2.5" marker-end="url(#arrowGreen)"/>
  <text x="452" y="612" text-anchor="start" font-size="12" font-weight="bold" fill="#15803d">APPROVED</text>

  <!-- Revisions requested: approval gate back to plan -->
  <path d="M320,224 H200 V144 H240" fill="none" stroke="#b45309" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <text x="120" y="186" text-anchor="middle" font-size="11" font-weight="bold" fill="#78350f">Revisions</text>
  <text x="120" y="200" text-anchor="middle" font-size="11" font-weight="bold" fill="#78350f">requested</text>

  <!-- Test failure loop -->
  <path d="M240,387 H120 V307 H240" fill="none" stroke="#ea580c" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrowOrange)"/>
  <text x="175" y="342" text-anchor="middle" font-size="11" font-weight="bold" fill="#c2410c">Tests fail:</text>
  <text x="175" y="356" text-anchor="middle" font-size="11" font-weight="bold" fill="#c2410c">fix task</text>

  <!-- Review CHANGES REQUESTED loop -->
  <path d="M530,552 H860 V307 H640" fill="none" stroke="#b91c1c" stroke-width="2.2" marker-end="url(#arrowRed)"/>
  <text x="695" y="544" text-anchor="middle" font-size="12" font-weight="bold" fill="#b91c1c">CHANGES REQUESTED</text>
  <text x="870" y="420" text-anchor="start" font-size="11" fill="#b91c1c">Feedback loop to developer</text>
  <text x="870" y="436" text-anchor="start" font-size="11" fill="#b91c1c">Max 3 review cycles</text>

  <!-- Needs discussion -->
  <line x1="350" y1="552" x2="250" y2="552" stroke="#dc2626" stroke-width="2" marker-end="url(#arrowRed)"/>
  <text x="300" y="545" text-anchor="middle" font-size="11" font-weight="bold" fill="#991b1b">NEEDS DISCUSSION</text>

  <!-- Legend -->
  <rect x="240" y="712" width="400" height="50" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="440" y="732" text-anchor="middle" font-size="11" fill="#475569">Green: gate passed. Orange and red: fix and escalation loops.</text>
  <text x="440" y="750" text-anchor="middle" font-size="11" fill="#475569">Plans and reports are stored in .antigravity/docs/backend/.</text>
</svg>
