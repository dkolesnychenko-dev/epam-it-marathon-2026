<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 570" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>
  <rect width="960" height="570" fill="#ffffff"/>
  <text x="480" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">Figure 1 - Four-Tier Architecture: Runtime, Models, Skills, and Agent Profiles</text>

  <!-- Tier 1: Agent profiles (top band) -->
  <rect x="30" y="50" width="900" height="110" rx="12" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
  <text x="480" y="72" text-anchor="middle" font-size="14" font-weight="bold" fill="#14532d">Agent Profiles (.antigravity/agents/backend/)</text>

  <rect x="50" y="82" width="195" height="66" rx="8" fill="#ffffff" stroke="#15803d" stroke-width="1.5"/>
  <text x="147.5" y="108" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f172a">orchestrator-agent.md</text>
  <text x="147.5" y="130" text-anchor="middle" font-size="11" fill="#334155">Plans, approval gate, delegates</text>

  <rect x="275" y="82" width="195" height="66" rx="8" fill="#ffffff" stroke="#15803d" stroke-width="1.5"/>
  <text x="372.5" y="108" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f172a">aws-lambda-agent.md</text>
  <text x="372.5" y="130" text-anchor="middle" font-size="11" fill="#334155">Writes .NET 10 and Syndicate code</text>

  <rect x="500" y="82" width="195" height="66" rx="8" fill="#ffffff" stroke="#15803d" stroke-width="1.5"/>
  <text x="597.5" y="108" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f172a">unit-test-agent.md</text>
  <text x="597.5" y="130" text-anchor="middle" font-size="11" fill="#334155">Writes xUnit tests in Tests/</text>

  <rect x="725" y="82" width="195" height="66" rx="8" fill="#ffffff" stroke="#15803d" stroke-width="1.5"/>
  <text x="822.5" y="108" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f172a">code-review-agent.md</text>
  <text x="822.5" y="130" text-anchor="middle" font-size="11" fill="#334155">Read-only audit, returns verdict</text>

  <!-- Profiles load into the engine -->
  <line x1="450" y1="160" x2="450" y2="186" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="462" y="178" text-anchor="start" font-size="10" fill="#334155">loaded as system prompt</text>

  <!-- Tier 3: Antigravity Engine -->
  <rect x="300" y="186" width="300" height="334" rx="12" fill="#ede9fe" stroke="#6d28d9" stroke-width="2"/>
  <text x="450" y="210" text-anchor="middle" font-size="14" font-weight="bold" fill="#4c1d95">Antigravity Engine (Runtime)</text>

  <rect x="320" y="226" width="260" height="58" rx="8" fill="#ffffff" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="450" y="248" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f172a">Agent harness</text>
  <text x="450" y="267" text-anchor="middle" font-size="11" fill="#334155">Routes tool calls, manages subagents</text>

  <rect x="320" y="296" width="260" height="58" rx="8" fill="#ffffff" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="450" y="318" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f172a">Context and message loop</text>
  <text x="450" y="337" text-anchor="middle" font-size="11" fill="#334155">Isolates contexts, appends observations</text>

  <rect x="320" y="366" width="260" height="58" rx="8" fill="#ffffff" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="450" y="388" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f172a">Isolated sandbox</text>
  <text x="450" y="407" text-anchor="middle" font-size="11" fill="#334155">PowerShell: dotnet build, test, git</text>

  <rect x="320" y="436" width="260" height="76" rx="8" fill="#ffffff" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="450" y="458" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f172a">Base tools</text>
  <text x="450" y="478" text-anchor="middle" font-size="11" fill="#334155">read_file, edit_file, write_file,</text>
  <text x="450" y="496" text-anchor="middle" font-size="11" fill="#334155">run_command, invoke_subagent</text>

  <!-- Tier 1 (IDE): presentation layer -->
  <rect x="30" y="186" width="230" height="160" rx="12" fill="#e0f2fe" stroke="#0369a1" stroke-width="2"/>
  <text x="145" y="214" text-anchor="middle" font-size="14" font-weight="bold" fill="#0c4a6e">User &amp; Workspace (IDE)</text>
  <text x="145" y="242" text-anchor="middle" font-size="12" fill="#0f172a">Chat, approval prompts, logs</text>
  <text x="145" y="262" text-anchor="middle" font-size="12" fill="#0f172a">Model selector and artifacts</text>
  <text x="145" y="290" text-anchor="middle" font-size="11" fill="#475569">Display only, no agent logic</text>

  <!-- IDE to engine -->
  <line x1="260" y1="220" x2="300" y2="220" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="280" y="212" text-anchor="middle" font-size="10" fill="#334155">prompt</text>
  <line x1="300" y1="250" x2="260" y2="250" stroke="#334155" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
  <text x="280" y="242" text-anchor="middle" font-size="10" fill="#334155">progress</text>

  <!-- Tier 2: Backend skills -->
  <rect x="660" y="186" width="270" height="334" rx="12" fill="#fdf4ff" stroke="#a21caf" stroke-width="2"/>
  <text x="795" y="210" text-anchor="middle" font-size="14" font-weight="bold" fill="#701a75">Backend Skills</text>
  <text x="795" y="226" text-anchor="middle" font-size="10" fill="#701a75">(.antigravity/skills/backend/)</text>

  <rect x="675" y="238" width="240" height="50" rx="8" fill="#ffffff" stroke="#a21caf" stroke-width="1.5"/>
  <text x="795" y="258" text-anchor="middle" font-size="12" font-weight="bold" fill="#0f172a">route-register</text>
  <text x="795" y="275" text-anchor="middle" font-size="10" fill="#334155">Binds routes and DI in RouteRegistry.cs</text>

  <rect x="675" y="294" width="240" height="50" rx="8" fill="#ffffff" stroke="#a21caf" stroke-width="1.5"/>
  <text x="795" y="314" text-anchor="middle" font-size="12" font-weight="bold" fill="#0f172a">syndicate-config-gen</text>
  <text x="795" y="331" text-anchor="middle" font-size="10" fill="#334155">Generates Syndicate IaC JSON files</text>

  <rect x="675" y="350" width="240" height="50" rx="8" fill="#ffffff" stroke="#a21caf" stroke-width="1.5"/>
  <text x="795" y="370" text-anchor="middle" font-size="12" font-weight="bold" fill="#0f172a">dotnet-build-check</text>
  <text x="795" y="387" text-anchor="middle" font-size="10" fill="#334155">Compiles and extracts clean diagnostics</text>

  <rect x="675" y="406" width="240" height="50" rx="8" fill="#ffffff" stroke="#a21caf" stroke-width="1.5"/>
  <text x="795" y="426" text-anchor="middle" font-size="12" font-weight="bold" fill="#0f172a">dotnet-test-runner</text>
  <text x="795" y="443" text-anchor="middle" font-size="10" fill="#334155">Runs xUnit, extracts failure traces</text>

  <rect x="675" y="462" width="240" height="50" rx="8" fill="#ffffff" stroke="#a21caf" stroke-width="1.5"/>
  <text x="795" y="482" text-anchor="middle" font-size="12" font-weight="bold" fill="#0f172a">backend-code-review-audit</text>
  <text x="795" y="499" text-anchor="middle" font-size="10" fill="#334155">DynamoDB, async and security checklist</text>

  <!-- Engine to skills -->
  <line x1="600" y1="276" x2="660" y2="276" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="630" y="268" text-anchor="middle" font-size="10" fill="#334155">runbook</text>
  <line x1="660" y1="306" x2="600" y2="306" stroke="#334155" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
  <text x="630" y="298" text-anchor="middle" font-size="10" fill="#334155">result</text>

  <!-- Tier 4: Foundation model -->
  <rect x="30" y="400" width="230" height="130" rx="12" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
  <text x="145" y="426" text-anchor="middle" font-size="14" font-weight="bold" fill="#78350f">Inference Engine (Model)</text>
  <text x="145" y="448" text-anchor="middle" font-size="12" fill="#0f172a">Gemini, GPT-series, Claude</text>
  <text x="145" y="468" text-anchor="middle" font-size="11" fill="#0f172a">Reasons, plans, emits tool calls</text>
  <text x="145" y="486" text-anchor="middle" font-size="11" fill="#475569">No direct file or shell access</text>

  <!-- Model to engine -->
  <line x1="260" y1="440" x2="300" y2="440" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="280" y="432" text-anchor="middle" font-size="10" fill="#334155">calls</text>
  <line x1="300" y1="480" x2="260" y2="480" stroke="#334155" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
  <text x="280" y="472" text-anchor="middle" font-size="10" fill="#334155">results</text>

  <text x="480" y="556" text-anchor="middle" font-size="11" fill="#64748b">Solid arrow = request or call. Dashed arrow = result returned. Profiles are loaded by the engine; skills run as runbooks.</text>
</svg>
