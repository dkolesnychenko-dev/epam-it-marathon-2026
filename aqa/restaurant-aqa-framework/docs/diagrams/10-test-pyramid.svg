<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 410" width="980" height="410" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><marker id="m_gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker><marker id="m_green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#15803d"/></marker><marker id="m_red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker><marker id="m_amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker></defs><rect width="980" height="410" fill="#ffffff"/><text x="490.0" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">Test pyramid</text><polygon points="340.0,60 460.0,60 556.4285714285714,150 243.57142857142856,150" fill="#fef3c7" stroke="#b45309" stroke-width="2"/><text x="400" y="103.0" text-anchor="middle" font-size="14" fill="#78350f" font-weight="bold">E2E (end-to-end)</text><text x="400" y="121.0" text-anchor="middle" font-size="11" fill="#78350f">UI and API together, like a real user</text><text x="800" y="109.0" text-anchor="start" font-size="12" fill="#475569">few, slow</text><polygon points="232.85714285714286,160 567.1428571428571,160 663.5714285714286,250 136.42857142857144,250" fill="#e2e8f0" stroke="#475569" stroke-width="2"/><text x="400" y="203.0" text-anchor="middle" font-size="14" fill="#0f172a" font-weight="bold">Integration and API</text><text x="400" y="221.0" text-anchor="middle" font-size="11" fill="#334155">several parts together, no browser</text><text x="800" y="209.0" text-anchor="start" font-size="12" fill="#475569">medium</text><polygon points="125.71428571428572,260 674.2857142857142,260 770.7142857142858,350 29.285714285714278,350" fill="#dcfce7" stroke="#15803d" stroke-width="2"/><text x="400" y="303.0" text-anchor="middle" font-size="14" fill="#0f172a" font-weight="bold">Unit</text><text x="400" y="321.0" text-anchor="middle" font-size="11" fill="#14532d">single methods, milliseconds</text><text x="800" y="309.0" text-anchor="start" font-size="12" fill="#475569">many, fast</text><text x="490" y="390" text-anchor="middle" font-size="11" fill="#475569">The higher the level, the slower the test and the closer it is to a real user.</text></svg>