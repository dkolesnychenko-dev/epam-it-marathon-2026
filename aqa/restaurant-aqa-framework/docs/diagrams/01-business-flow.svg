<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 540" width="980" height="540" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><marker id="m_gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker><marker id="m_green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#15803d"/></marker><marker id="m_red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker><marker id="m_amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker></defs><rect width="980" height="540" fill="#ffffff"/><text x="490.0" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">Group pre-order: business flow</text><rect x="270" y="62" width="440" height="54" rx="10" fill="#e2e8f0" stroke="#475569" stroke-width="2"/><text x="490.0" y="88.5" text-anchor="middle" font-size="14" fill="#0f172a" font-weight="bold">Owner creates a group booking</text><text x="490.0" y="103.5" text-anchor="middle" font-size="11" fill="#334155">a table group with a link for guests</text><path d="M490,116 L490,136" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#m_gray)"/><rect x="270" y="136" width="440" height="54" rx="10" fill="#e2e8f0" stroke="#475569" stroke-width="2"/><text x="490.0" y="162.5" text-anchor="middle" font-size="14" fill="#0f172a" font-weight="bold">Guests join with the link</text><text x="490.0" y="177.5" text-anchor="middle" font-size="11" fill="#334155">each guest gets their own cart</text><path d="M490,190 L490,210" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#m_gray)"/><rect x="270" y="210" width="440" height="54" rx="10" fill="#e2e8f0" stroke="#475569" stroke-width="2"/><text x="490.0" y="236.5" text-anchor="middle" font-size="14" fill="#0f172a" font-weight="bold">Guests add dishes</text><text x="490.0" y="251.5" text-anchor="middle" font-size="11" fill="#334155">each guest sees their own total</text><path d="M490,264 L490,284" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#m_gray)"/><rect x="270" y="284" width="440" height="54" rx="10" fill="#e2e8f0" stroke="#475569" stroke-width="2"/><text x="490.0" y="310.5" text-anchor="middle" font-size="14" fill="#0f172a" font-weight="bold">Owner views the summary</text><text x="490.0" y="325.5" text-anchor="middle" font-size="11" fill="#334155">who ordered what, prices, total sum</text><path d="M490,338 L490,358" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#m_gray)"/><rect x="270" y="358" width="440" height="54" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="2"/><text x="490.0" y="384.5" text-anchor="middle" font-size="14" fill="#78350f" font-weight="bold">Owner confirms the pre-order</text><text x="490.0" y="399.5" text-anchor="middle" font-size="11" fill="#78350f">only confirmed carts are used</text><path d="M490,412 L490,432" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#m_gray)"/><rect x="270" y="432" width="440" height="54" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="2"/><text x="490.0" y="458.5" text-anchor="middle" font-size="14" fill="#0f172a" font-weight="bold">Waiter sees the final order</text><text x="490.0" y="473.5" text-anchor="middle" font-size="11" fill="#14532d">one combined line per dish</text><text x="490" y="510" text-anchor="middle" font-size="11" fill="#475569">Amber: confirmation step. Green: final result.</text></svg>