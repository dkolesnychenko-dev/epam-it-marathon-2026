0" height="56" rx="10" fill="#e2e8f0" stroke="#475569" stroke-width="2"/><text x="490.0" y="267.5" text-anchor="middle" font-size="14" fill="#0f172a" font-weight="bold">3. Text</text><text x="490.0" y="282.5" text-anchor="middle" font-size="11" fill="#334155">GetByText(...)</text><path d="M490,296 L490,330" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#m_gray)"/><rect x="300" y="330" width="380" height="56" rx="10" fill="#e2e8f0" stroke="#475569" stroke-width="2"/><text x="490.0" y="357.5" text-anchor="middle" font-size="14" fill="#0f172a" font-weight="bold">4. Test ID</text><text x="490.0" y="372.5" text-anchor="middle" font-size="11" fill="#334155">GetByTestId(...)</text><path d="M490,386 L490,420" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#m_gray)"/><rect x="300" y="420" width="380" height="56" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="2"/><text x="490.0" y="447.5" text-anchor="middle" font-size="14" fill="#78350f" font-weight="bold">5. CSS selector</text><text x="490.0" y="462.5" text-anchor="middle" font-size="11" fill="#78350f">only if nothing else works</text><text x="705" y="92" text-anchor="start" font-size="12" fill="#15803d">closest to what the user sees</text><text x="705" y="452" text-anchor="start" font-size="12" fill="#b45309">breaks when the layout changes</text></svg>