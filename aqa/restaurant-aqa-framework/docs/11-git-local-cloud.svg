<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 510" width="980" height="510" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><marker id="m_gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker><marker id="m_green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#15803d"/></marker><marker id="m_red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker><marker id="m_amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker></defs><rect width="980" height="510" fill="#ffffff"/><text x="490.0" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">Git hooks and GitHub Actions: local and cloud</text><rect x="20" y="60" width="940" height="190" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="20" y="290" width="940" height="200" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="40" y="80" text-anchor="start" font-size="12" fill="#334155" font-weight="bold">Local, your PC</text><text x="40" y="310" text-anchor="start" font-size="12" fill="#334155" font-weight="bold">GitHub, cloud</text><rect x="40" y="130" width="125" height="64" rx="10" fill="#e2e8f0" stroke="#475569" stroke-width="2"/><text x="102.5" y="161.5" text-anchor="middle" font-size="13" fill="#0f172a" font-weight="bold">Write code</text><text x="102.5" y="175.5" text-anchor="middle" font-size="10" fill="#334155">scenarios and code</text><path d="M165,162 L193,162" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#m_gray)"/><rect x="193" y="130" width="125" height="64" rx="10" fill="#e2e8f0" stroke="#475569" stroke-width="2"/><text x="255.5" y="161.5" text-anchor="middle" font-size="13" fill="#0f172a" font-weight="bold">git commit</text><text x="255.5" y="175.5" text-anchor="middle" font-size="10" fill="#334155">save locally</text><path d="M318,162 L346,162" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#m_gray)"/><rect x="346" y="130" width="125" height="64" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="2"/><text x="408.5" y="161.5" text-anchor="middle" font-size="13" fill="#78350f" font-weight="bold">pre-commit</text><text x="408.5" y="175.5" text-anchor="middle" font-size="10" fill="#78350f">format and gherkin lint</text><path d="M471,162 L499,162" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#m_gray)"/><rect x="499" y="130" width="125" height="64" rx="10" fill="#e2e8f0" stroke="#475569" stroke-width="2"/><text x="561.5" y="161.5" text-anchor="middle" font-size="13" fill="#0f172a" font-weight="bold">git push</text><text x="561.5" y="175.5" text-anchor="middle" font-size="10" fill="#334155">send to GitHub</text><path d="M624,162 L652,162" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#m_gray)"/><rect x="652" y="130" width="125" height="64" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="2"/><text x="714.5" y="161.5" text-anchor="middle" font-size="13" fill="#78350f" font-weight="bold">pre-push</text><text x="714.5" y="175.5" text-anchor="middle" font-size="10" fill="#78350f">dotnet build</text><path d="M777,162 L805,162" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#m_gray)"/><rect x="805" y="130" width="125" height="64" rx="10" fill="#e2e8f0" stroke="#475569" stroke-width="2"/><text x="867.5" y="161.5" text-anchor="middle" font-size="13" fill="#0f172a" font-weight="bold">Code in GitHub</text><text x="867.5" y="175.5" text-anchor="middle" font-size="10" fill="#334155">next: the cloud</text><path d="M408.5,130 L408.5,110 L102.5,110 L102.5,130" fill="none" stroke="#b91c1c" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#m_red)"/><text x="255" y="104" text-anchor="middle" font-size="11" font-weight="bold" fill="none" stroke="#ffffff" stroke-width="4" stroke-linejoin="round">error: fix and retry</text><text x="255" y="104" text-anchor="middle" font-size="11" font-weight="bold" fill="#b91c1c">error: fix and retry</text><path d="M714.5,130 L714.5,90 L102.5,90 L102.5,130" fill="none" stroke="#b91c1c" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#m_red)"/><text x="560" y="84" text-anchor="middle" font-size="11" font-weight="bold" fill="none" stroke="#ffffff" stroke-width="4" stroke-linejoin="round">build error</text><text x="560" y="84" text-anchor="middle" font-size="11" font-weight="bold" fill="#b91c1c">build error</text><text x="40" y="240" text-anchor="start" font-size="11" fill="#475569">Without activating the hooks, local checks are skipped.</text><path d="M867.5,194 L867.5,340" fill="none" stroke="#15803d" stroke-width="2.5" marker-end="url(#m_green)"/><rect x="700" y="340" width="240" height="70" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="2"/><text x="820.0" y="374.5" text-anchor="middle" font-size="14" fill="#0f172a" font-weight="bold">aqa-quality.yml</text><text x="820.0" y="389.5" text-anchor="middle" font-size="11" fill="#14532d">every push and PR: lint, build</text><rect x="360" y="340" width="260" height="70" rx="10" fill="#e2e8f0" stroke="#475569" stroke-width="2"/><text x="490.0" y="374.5" text-anchor="middle" font-size="14" fill="#0f172a" font-weight="bold">aqa-tests.yml</text><text x="490.0" y="389.5" text-anchor="middle" font-size="11" fill="#334155">nightly schedule or manual run</text><text x="490" y="458" text-anchor="middle" font-size="11" fill="#475569">aqa-tests does not run on every push. Both use secrets stored in the repo Settings.</text></svg>